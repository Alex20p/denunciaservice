# Perfil exclusivo de Render. Los valores se guardan en Environment, nunca en Git.
server.address=0.0.0.0
server.port=${PORT:10000}

spring.datasource.url=jdbc:postgresql://${RENDER_DB_HOST}:${RENDER_DB_PORT:5432}/${RENDER_DB_NAME}?sslmode=require
spring.datasource.username=${RENDER_DB_USER}
spring.datasource.password=${RENDER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate genera el esquema PostgreSQL a partir de las entidades originales.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
